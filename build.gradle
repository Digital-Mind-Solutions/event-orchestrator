plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}
group = 'org.digitalmind'
version = '1.0.3'

ext {
    lombokVersion = '1.18.32'
    springOpenapiVersion = '2.6.0'
    swaggerAnnotationsVersion = '2.2.25'

    mapstructVersion = '1.3.1.Final'
    //springfoxVersion = '2.9.2'
    //swaggerVersion = '1.6.0'
    //swaggerCodegenVersion = '2.4.0'
}
java {
    sourceCompatibility = "21"
    targetCompatibility = "21"
}

bootJar {
    enabled = false
}
jar {
    archiveBaseName = "event-orchestrator"
    enabled = true
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:Greenwich.SR5'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "digitalmind"
        url = uri("https://maven.pkg.github.com/Digital-Mind-Solutions/maven-repository")
        credentials {
            username = project.findProperty("dm.ghub.user") ?: System.getenv("DM_GITHUB_USER")
            password = project.findProperty("dm.ghub.key") ?: System.getenv("DM_GITHUB_TOKEN")
        }
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation "org.springframework.boot:spring-boot-starter-security"

    implementation "org.digitalmind.buildingblocks.core:dtobase:2.0.1"
    implementation "org.digitalmind.buildingblocks.core:beanutils:2.0.1"
    implementation "org.digitalmind.buildingblocks.core:spelutils:2.0.1"
    implementation "org.digitalmind.buildingblocks.core:networkutils:2.0.1"
    implementation "org.digitalmind.buildingblocks.core:requestcontext:2.0.1"
    implementation "org.digitalmind.buildingblocks.templating:templating-core:2.0.1"
    implementation "org.digitalmind.buildingblocks.core:jpautils:2.0.1"

    implementation 'commons-io:commons-io:2.6'

    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "org.mapstruct:mapstruct-jdk8:${mapstructVersion}"
    implementation "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    implementation 'com.github.jknack:handlebars:4.1.2'
    implementation 'com.github.jknack:handlebars-helpers:4.1.2'
    implementation 'com.github.jknack:handlebars-guava-cache:4.1.2'
    implementation 'com.github.jknack:handlebars-jackson2:4.1.2'
    implementation 'org.beryx:handlebars-java-helpers:0.4.1'

    //implementation "io.springfox:springfox-swagger-ui:${springfoxVersion}"
    //implementation "io.springfox:springfox-swagger2:${springfoxVersion}"
    //implementation "io.swagger:swagger-annotations:${swaggerVersion}"
    //implementation "io.swagger:swagger-models:${swaggerVersion}"
    //implementation "io.swagger:swagger-core:${swaggerVersion}"
}

publishing {
    repositories {
        maven {
            name = "digitalmind"
            url = uri("https://maven.pkg.github.com/Digital-Mind-Solutions/maven-repository")
            credentials {
                username = project.findProperty("dm.ghub.user") ?: System.getenv("DM_GITHUB_USER")
                password = project.findProperty("dm.ghub.key") ?: System.getenv("DM_GITHUB_TOKEN")
            }
        }
    }
    publications {
        eventOrchestrator(MavenPublication) {
            from components.java
        }
    }
}
